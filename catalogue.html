<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base" content="__APIBASE__">
  <title>newsy — catalogue</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="catalogue.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-row">
        <h1 class="nav-title"><a href="./" class="nav-link">newsy</a></h1>
        <p class="tagline">feed catalogue</p>
        <a href="sources.html" class="header-link back-link" style="margin-left:auto">&larr; sources</a>
      </div>
    </header>

    <!-- Import bar -->
    <div class="import-bar">
      <button id="import-opml-btn" class="btn btn-primary btn-sm">import OPML</button>
      <button id="add-feed-btn" class="btn btn-secondary btn-sm">+ add feed</button>
      <button id="load-default-btn" class="btn btn-ghost btn-sm" title="Load the built-in default catalogue">load default</button>
      <span class="import-sep"></span>
      <span id="cat-stats" class="cat-stats"></span>
      <button id="clear-cat-btn" class="btn btn-ghost btn-sm btn-danger-text" title="Clear entire catalogue">clear all</button>
    </div>

    <!-- OPML import panel (hidden) -->
    <div id="opml-panel" class="panel hidden">
      <h3>Import OPML</h3>
      <div class="form-row">
        <input id="opml-file" type="file" accept=".opml,.xml" class="input">
        <span class="form-or">or paste XML</span>
      </div>
      <textarea id="opml-text" class="input opml-textarea" rows="4" placeholder="Paste OPML/XML content here..."></textarea>
      <div class="form-row form-row-actions">
        <button id="opml-parse-btn" class="btn btn-primary">parse</button>
        <button id="opml-cancel-btn" class="btn btn-ghost">cancel</button>
      </div>
      <div id="opml-result" class="opml-result hidden"></div>
    </div>

    <!-- Manual add panel (hidden) -->
    <div id="add-panel" class="panel hidden">
      <h3>Add Feed</h3>
      <div class="form-row">
        <input id="add-name" type="text" placeholder="Feed name" class="input">
        <input id="add-url" type="text" placeholder="RSS feed URL" class="input input-wide">
      </div>
      <div class="form-row">
        <select id="add-category" class="input"></select>
        <input id="add-country" type="text" placeholder="Country (e.g. uk, de)" class="input" value="">
        <input id="add-language" type="text" placeholder="Language (e.g. en, de)" class="input">
      </div>
      <div class="form-row form-row-actions">
        <button id="test-url-btn" class="btn btn-secondary">test URL</button>
        <button id="confirm-add-btn" class="btn btn-primary">add to catalogue</button>
        <button id="cancel-add-btn" class="btn btn-ghost">cancel</button>
      </div>
      <div id="url-test-result" class="test-result hidden"></div>
    </div>

    <!-- Filter / search bar -->
    <div class="toolbar">
      <div class="filter-group">
        <input id="cat-search" type="text" class="input input-search" placeholder="search feeds..." autocomplete="off">
        <select id="filter-category"><option value="">all categories</option></select>
        <select id="filter-language"><option value="">all languages</option></select>
        <select id="filter-status">
          <option value="">all statuses</option>
          <option value="untested">untested</option>
          <option value="pass">pass</option>
          <option value="warn">warn</option>
          <option value="fail">fail</option>
        </select>
        <select id="sort-by">
          <option value="quality">sort: quality</option>
          <option value="name">sort: name</option>
          <option value="added">sort: added</option>
        </select>
      </div>
    </div>

    <!-- Bulk action bar (shown when selection > 0) -->
    <div id="bulk-bar" class="bulk-bar hidden">
      <label class="bulk-select-all">
        <input id="select-all" type="checkbox"> <span id="select-count">0 selected</span>
      </label>
      <div class="bulk-actions">
        <button id="bulk-test" class="btn btn-sm btn-secondary" title="Test selected feeds">test selected</button>
        <button id="bulk-curate" class="btn btn-sm btn-primary" title="Add selected to curated sources">curate selected</button>
      </div>
    </div>

    <!-- Feed list -->
    <main id="cat-container">
      <div id="loading" class="status-message"><p>Loading catalogue...</p></div>
    </main>
  </div>

  <!-- Curate confirmation modal -->
  <div id="curate-modal" class="diff-modal-backdrop hidden">
    <div class="diff-modal">
      <div class="diff-modal-header">
        <h2 id="curate-modal-title" class="diff-modal-title">Add to curated sources</h2>
        <button id="curate-modal-close" class="btn-ghost diff-close">&times;</button>
      </div>
      <div id="curate-modal-body" class="diff-modal-body"></div>
      <div class="diff-modal-footer">
        <div class="diff-footer-actions">
          <button id="curate-confirm" class="btn btn-primary">add to sources</button>
          <button id="curate-cancel" class="btn btn-ghost">cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="api-config.js"></script>
  <script src="idb.js"></script>
  <script src="catalogue.js"></script>
</body>
</html>
